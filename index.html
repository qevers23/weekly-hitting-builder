<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly Hitting Template Builder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400;1,700&display=swap">
<style>
  :root{
    --ink:#000000; --paper:#FFFFFF;
    /* accent, set by the team-color picker; --gold is the accent token */
    --gold:#FFA300; --wash:#FFF4DF; --accent-on:#000000; --accent-lift:#FFA300;
    --rule:#E5E1D8; --line:#C9C4B9; --muted:#7A756B; --ghost:#B4AFA4;
    --sans:'Lato','Gotham','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{margin:0}
  body{background:#EDEAE3;color:var(--ink);font-family:var(--sans)}

  /* ---------------- toolbar ---------------- */
  .bar{position:sticky;top:0;z-index:20;background:var(--ink);color:var(--paper);padding:9px 18px;
       display:flex;flex-direction:column;gap:8px}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:9px}
  .row+.row{border-top:1px solid #2A2723;padding-top:8px}
  .brand{font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--accent-lift);margin-right:2px}
  button{font-family:var(--sans);font-weight:900;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;
         background:transparent;color:var(--paper);border:1px solid #4A463F;border-radius:8px;padding:7px 11px;cursor:pointer}
  button:hover{border-color:var(--gold);color:var(--gold)}
  button.on{background:var(--gold);border-color:var(--gold);color:var(--accent-on)}
  button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  select,.num{background:#141414;color:var(--paper);border:1px solid #4A463F;border-radius:8px;
              padding:6px 8px;font-family:var(--sans);font-weight:700;font-size:13px}
  select{max-width:230px}
  .num{width:54px}
  label.f{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#B9B4AA;
          display:flex;align-items:center;gap:6px}
  .hint{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B9B4AA;
        margin-left:auto;font-variant-numeric:tabular-nums}
  .hint b{color:var(--accent-lift);font-weight:900}
  .daytoggles{display:flex;gap:4px;flex-wrap:wrap}
  .daytoggles button{padding:6px 8px;min-width:38px;letter-spacing:.06em}
  .swatches{display:flex;gap:4px}
  .cswatch{width:18px;height:18px;border-radius:4px;border:1px solid #4A463F;padding:0;cursor:pointer}
  .cswatch[aria-pressed="true"]{outline:2px solid var(--paper);outline-offset:1px}
  input[type=color]{width:30px;height:24px;padding:0;background:#141414;border:1px solid #4A463F;border-radius:6px;cursor:pointer}
  .saved{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#6E6A62}
  .saved.flash{color:var(--accent-lift)}
  .sib{font-size:10.5px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#B9B4AA;
       text-decoration:none;border-bottom:1px solid #4A463F;padding-bottom:1px}
  .sib:hover{color:var(--gold);border-bottom-color:var(--gold)}

  /* ---------------- sheet ---------------- */
  .sheet{background:var(--paper);max-width:1180px;margin:26px auto 60px;padding:44px 46px 40px}
  h1{font-size:clamp(32px,5vw,54px);font-weight:900;letter-spacing:-.02em;line-height:.98;margin:0;text-transform:uppercase}
  .sub{margin:12px 0 0;font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .goldrule{height:4px;background:var(--gold);margin:16px 0 0}

  .env{display:flex;align-items:stretch;background:var(--wash);margin-top:14px}
  .env .tag{background:var(--gold);color:var(--accent-on);font-weight:900;letter-spacing:.14em;text-transform:uppercase;
            font-size:11px;display:flex;align-items:center;padding:12px 16px;white-space:nowrap}
  .env .body{padding:12px 18px;font-size:15px;font-style:italic;line-height:1.45;display:flex;align-items:center;flex:1;min-width:0}

  .week{margin-top:6px}
  .day{display:grid;grid-template-columns:var(--daycol,210px) repeat(var(--cols,3),1fr);
       border-top:1px solid var(--rule);padding:16px 0;break-inside:avoid;page-break-inside:avoid}
  .day:first-child{border-top:0}
  .daylab{padding-right:18px}
  .daylab .nm{font-size:29px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
  .daylab .fo{font-size:15px;font-weight:700;line-height:1.25;margin-top:6px}
  .daylab .me{font-size:15px;font-weight:700;line-height:1.25}
  .daylab .ph{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-top:8px}
  .daylab .ph.soft{color:var(--muted);font-style:italic;letter-spacing:.04em;text-transform:none;font-weight:400;font-size:13.5px}

  .cell{padding:0 16px;border-left:1px solid var(--rule);min-width:0}
  .cell.field{border-left:2px solid var(--rule)}
  .cell .stn{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .cell h4{margin:0;font-size:16px;font-weight:900;text-transform:uppercase;line-height:1.15}
  .cell .cap{height:3px;background:var(--gold);margin:4px 0 11px;max-width:100%}
  /* block, not flex: a long drill name wraps as prose instead of the name and
     the swing count each collapsing into their own narrow column */
  .drill{font-size:14px;line-height:1.5;margin-bottom:2px;position:relative;padding-right:20px}
  .drill .n{font-weight:400}
  .drill .dash{color:var(--ink);margin:0 3px}
  .drill .sw{font-weight:400}
  .drill .del{position:absolute;right:0;top:-1px}
  .fieldnote{font-size:14px;line-height:1.45;margin-top:4px}
  .fieldnote .ex{font-style:italic;color:var(--muted)}
  .fieldnote .v{font-weight:900;text-transform:uppercase}

  .offrow{display:flex;align-items:baseline;gap:22px;border-top:1px solid var(--rule);padding:14px 0 12px}
  .offrow .nm{font-size:26px;font-weight:900;text-transform:uppercase;color:var(--ghost);line-height:1}
  .offrow .tx{font-size:15px;color:var(--muted)}

  .footer{border-top:2px solid var(--ink);margin-top:2px;padding-top:12px}
  .footer .tokens{font-size:13.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;line-height:1.5}
  .footer .note{font-size:13.5px;font-style:italic;color:var(--muted);line-height:1.55;margin-top:9px}

  /* ---------------- editing ---------------- */
  [data-p]{outline:none}
  body.editing [data-p]{border-bottom:1px dashed rgba(255,163,0,.8);cursor:text}
  body.editing [data-p]:focus{background:var(--wash);border-bottom-color:var(--gold)}
  [data-p].inline{display:inline-block;min-width:18px}
  [data-p]:empty::before{content:attr(data-ph);color:var(--ghost);font-style:italic;font-weight:400;
                         letter-spacing:0;text-transform:none;pointer-events:none}
  .del{border:0;color:var(--ghost);padding:1px 5px;font-size:15px;line-height:1;letter-spacing:0;background:none}
  .del:hover{color:#C00}
  .rowbtn{border-color:var(--rule);color:var(--muted);padding:4px 9px;margin-top:5px}
  .rowbtn:hover{border-color:var(--gold);color:#8A5A00}
  body:not(.editing) .rowbtn,body:not(.editing) .del{display:none}
  body:not(.editing) [data-p]:empty::before{content:""}
  body:not(.editing) .drill{padding-right:0}
  /* the "ex." prefix is scaffolding for an empty field -- drop the whole line
     once the coach stops editing, or a blank day prints a bare "ex." */
  body:not(.editing) .fieldnote:has([data-p]:empty){display:none}

  @media (max-width:820px){
    .sheet{padding:28px 22px 32px;margin:14px}
    .day{grid-template-columns:1fr!important;gap:14px}
    .daylab{padding-right:0}
    .cell{border-left:0!important;padding:0;border-top:1px solid var(--rule);padding-top:10px}
    .env{flex-direction:column}
    .env .tag{justify-content:flex-start}
  }
  /* Print: hold the on-screen grid and scale it to Letter. These rules come
     after the width breakpoint on purpose -- at 8.5in the 820px mobile stack
     would otherwise fire and print every day as one tall column. */
  @media print{
    @page{size:letter portrait;margin:.4in}
    html,body{background:#fff}
    .bar{display:none}
    .sheet{margin:0;max-width:none;width:100%;padding:0}
    [data-p]{border-bottom:0!important;background:none!important}
    [data-p]:empty::before{content:""!important}
    .rowbtn,.del{display:none!important}
    .drill{padding-right:0}
    .fieldnote:has([data-p]:empty){display:none!important}
    .env{flex-direction:row!important}
    .env .tag{justify-content:center!important}
    .cell{border-left:1px solid var(--rule)!important;border-top:0!important}
    .cell.field{border-left:2px solid var(--rule)!important}
    .daylab{padding-right:11px!important}

    h1{font-size:33px}
    .sub{font-size:9px;margin-top:7px;letter-spacing:.15em}
    .goldrule{height:3px;margin-top:10px}
    .env{margin-top:9px}
    .env .tag{font-size:7.5px;padding:7px 10px}
    .env .body{font-size:10px;padding:7px 11px}

    .day{grid-template-columns:var(--daycol,1.45in) repeat(var(--cols,3),1fr)!important;padding:9px 0}
    .daylab{padding-right:11px}
    .daylab .nm{font-size:17px}
    .daylab .fo,.daylab .me{font-size:9.5px;margin-top:3px}
    .daylab .ph{font-size:8px;margin-top:5px}
    .daylab .ph.soft{font-size:9px}
    .cell{padding:0 10px}
    .cell .stn{font-size:7px;margin-bottom:3px}
    .cell h4{font-size:10px}
    .cell .cap{height:2.5px;margin:3px 0 7px}
    .drill{font-size:9.5px;line-height:1.4;margin-bottom:1px}
    .fieldnote{font-size:9.5px}

    .offrow{padding:8px 0 7px;gap:16px}
    .offrow .nm{font-size:15px}
    .offrow .tx{font-size:9.5px}
    .footer{padding-top:8px}
    .footer .tokens{font-size:9px}
    .footer .note{font-size:9px;margin-top:6px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body>

<div class="bar">
  <div class="row">
    <span class="brand">Weekly Builder</span>
    <label class="f">Plan <select id="planSel"></select></label>
    <button id="newBtn">New</button>
    <button id="dupBtn">Duplicate</button>
    <button id="renameBtn">Rename</button>
    <button id="delBtn">Delete</button>
    <span class="saved" id="saved"></span>
    <a class="sib" href="https://qevers23.github.io/bp-builder/" target="_blank" rel="noopener">Pre-Game BP Builder &rarr;</a>
  </div>
  <div class="row">
    <button id="editBtn" class="on">Editing on</button>
    <label class="f">Cages <input class="num" id="nCages" type="number" min="1" max="4" value="2"></label>
    <label class="f">Days <span class="daytoggles" id="dayToggles"></span></label>
    <button id="pdfBtn">Save PDF</button>
    <button id="printBtn">Print</button>
    <button id="clearBtn">Clear sheet</button>
    <label class="f">Team color <span class="swatches" id="swatches"></span>
      <input type="color" id="accentPick" title="Any color"></label>
    <span class="hint" id="hint"></span>
  </div>
</div>

<div class="sheet" id="sheet"></div>

<script>
/* ============ team color ============ */
const PRESETS = [
  ["Gold","#FFA300"],["Red","#B3202C"],["Maroon","#6E1420"],["Orange","#D2560E"],
  ["Kelly","#1E9E52"],["Forest","#14603A"],["Carolina","#4B9CD3"],["Royal","#1B4FA0"],
  ["Navy","#14375E"],["Purple","#4A2A83"],["Black","#111111"]
];
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lum = h => { const [r,g,b] = hex2rgb(h).map(v=>{ v/=255; return v<=.03928 ? v/12.92 : Math.pow((v+.055)/1.055,2.4); }); return .2126*r+.7152*g+.0722*b; };
const mix = (h,pct) => "#" + hex2rgb(h).map(v => Math.round(v + (255-v)*pct).toString(16).padStart(2,"0")).join("");

function applyAccent(hex){
  const L = lum(hex), r = document.documentElement.style;
  r.setProperty("--gold", hex);
  r.setProperty("--wash", mix(hex, .90));                          // faint tint behind the environment bar
  r.setProperty("--accent-on", L > .18 ? "#000000" : "#FFFFFF");   // WCAG crossover, not eyeball
  r.setProperty("--accent-lift", L < .30 ? mix(hex, .45) : hex);   // readable on the black toolbar
  document.getElementById("accentPick").value = hex;
  document.querySelectorAll("#swatches .cswatch").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.c.toLowerCase() === hex.toLowerCase())));
}

/* ============ plan model ============ */
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const BLANK_DRILL = {n:"", sw:""};
const blankCell = () => ({head:"", drills:[{...BLANK_DRILL},{...BLANK_DRILL}]});

function blankDay(name, on){
  return {on, name, focus:"", metric:"", phase:"",
          cells:[blankCell(),blankCell(),blankCell()], fieldNote:""};
}

function blankState(){
  return {
    title:"Weekly Hitting Template",
    sub:"",
    envLabel:"Environment",
    envText:"",
    cages:2,
    cageNames:["Cage 1","Cage 2"],
    fieldName:"On Field",
    days: DAY_NAMES.map((n,i) => blankDay(n, i < 6)),
    offText:"Off",
    footer:"",
    footnote:""
  };
}

/* The fall calendar, transcribed from college_fall_hitting_calendar_TWITTER.png.
   Seeded as an example plan to duplicate -- new plans still open blank. */
function seedFallPlan(){
  const S = blankState();
  S.title = "College Fall — Weekly Hitting Template";
  S.sub = "2 cages + on field  •  Load / Stride phase rotation";
  S.envText = "Cages — Mini Hack (Oppo / Closed Angle, FB / BB / CH)  •  On Field — Hack Senior / Arm";
  const d = (i, focus, metric, phase, c1h, c1d, c2h, c2d, fh, note) => {
    const day = S.days[i];
    day.focus = focus; day.metric = metric; day.phase = phase; day.fieldNote = note;
    day.cells[0].head = c1h; day.cells[0].drills = c1d.map(([n,sw])=>({n,sw}));
    day.cells[1].head = c2h; day.cells[1].drills = c2d.map(([n,sw])=>({n,sw}));
    day.cells[2].head = fh;  day.cells[2].drills = [];
  };
  d(0,"Bat Speed","(Air Pull %)","Load",
    "RH Angle FB", [["Offset Rotation","12 swings"],["Step Backs","10 swings (Flow optional)"]],
    "LH Angle Breaking Ball", [["Pivot Picks","9 swings"],["Game Swings","9 swings"]],
    "Bat Speed (Air Pull %)", "HR Derby");
  d(1,"Bat to Ball","(Contact %)","Stride",
    "LH Angle FB", [["Offset Open","10 swings"],["Kershaw","10 swings"]],
    "RH Angle Breaking Ball", [["Hook Em","10 swings"],["Launch Angle Ladder","10 swings"]],
    "Bat to Ball (Contact %)", "Double Hack Attack BP");
  d(2,"Bat to Ball","(Air Pull %)","Load",
    "Middle FB", [["Offset Closed","10 swings"],["Step Backs","9 swings"]],
    "Middle Breaking Ball (Dealer's Choice)", [["Pivot Picks","10 swings"],["Keep It Fair","8 swings"]],
    "Bat to Ball (Air Pull %)", "");
  d(3,"Bat Speed","(Contact %)","Stride",
    "LH Angle FB", [["Step Behind","10 swings"],["Hook Em","9 swings"]],
    "RH Angle BB", [["Kershaw","10 swings"],["Flow Drill","9 swings"]],
    "Bat Speed (Contact %)", "");
  d(4,"Blend","","Compete Prep",
    "RH FB", [["Offset Rotation","12 swings"],["Step Backs","10 swings"]],
    "LH Angle FB", [["Kershaw","10 swings"],["Hook Em","10 swings"]],
    "Scrimmage", "");
  d(5,"Blend","","Compete Prep",
    "RH Breaking Ball", [["Offset Closed","10 swings"],["Step Behind","10 swings"]],
    "LH Breaking Ball", [["Pivot Picks","10 swings"],["Flow Drill","9 swings"]],
    "Scrimmage", "");
  S.footer = "Bat speed: Mon / Thu  •  Bat to ball: Tue / Wed  •  Load: Mon / Wed  •  Stride: Tue / Thu  •  Blend: Fri / Sat";
  S.footnote = "Both cages run the same drills each day — only the angle and pitch shape change. Blend days count toward both: on scrimmage days the goal is competing in the game, and a little of everything is how you get ready for that. Net: 3 bat speed days, 3 bat to ball days.";
  return S;
}

const KEY = "weekly-builder-plans-v1";
const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

let LIB = loadLib();     // {plans:{id:{name,updated,state}}, current:id, accent}
let S   = LIB.plans[LIB.current].state;

function loadLib(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const lib = JSON.parse(raw);
      if(lib && lib.plans && Object.keys(lib.plans).length){
        lib.accent = lib.accent || "#FFA300";
        if(!lib.plans[lib.current]) lib.current = Object.keys(lib.plans)[0];
        for(const p of Object.values(lib.plans)) p.state = Object.assign(blankState(), p.state);
        return lib;
      }
    }
  }catch(e){ /* blocked storage: run this session unsaved */ }
  const blank = newId(), fall = newId();
  return {
    plans:{
      [blank]:{name:"Plan 1", updated:Date.now(), state:blankState()},
      [fall]: {name:"College Fall — 2 Cage", updated:Date.now()-1, state:seedFallPlan()}
    },
    current: blank, accent:"#FFA300"
  };
}

let savedTimer;
function save(){
  LIB.plans[LIB.current].updated = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(LIB)); }catch(e){ return flag("Not saved - storage blocked"); }
  flag("Saved");
}
function flag(msg){
  const el = document.getElementById("saved");
  el.textContent = msg; el.classList.add("flash");
  clearTimeout(savedTimer);
  savedTimer = setTimeout(()=>{ el.classList.remove("flash"); el.textContent = planLabel(); }, 1400);
}
const planLabel = () => {
  const n = Object.keys(LIB.plans).length;
  return n + (n === 1 ? " plan saved" : " plans saved");
};

/* ============ render ============ */
const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;");
const ed = (path,val,ph,cls="inline") =>
  `<span class="${cls}" data-p="${path}" data-ph="${esc(ph)}">${esc(val)}</span>`;
const edBlock = (path,val,ph,cls) =>
  `<div class="${cls}" data-p="${path}" data-ph="${esc(ph)}">${esc(val)}</div>`;

function renderPlanList(){
  const sel = document.getElementById("planSel");
  sel.innerHTML = Object.entries(LIB.plans)
    .sort((a,b)=>b[1].updated - a[1].updated)
    .map(([id,p])=>`<option value="${id}"${id===LIB.current?" selected":""}>${esc(p.name)}</option>`).join("");
  document.getElementById("saved").textContent = planLabel();
}

const colName = ci => ci < S.cages ? S.cageNames[ci] : S.fieldName;
const colPath = ci => ci < S.cages ? `cageNames.${ci}` : "fieldName";

function renderCell(di, ci){
  const cell = S.days[di].cells[ci];
  const last = ci === S.cages;
  const day  = S.days[di];
  const note = last ? `
    <div class="fieldnote"><span class="ex">ex.</span>
      <span class="v">${ed(`days.${di}.fieldNote`, day.fieldNote, "On-field game or round")}</span></div>` : "";
  return `
    <div class="cell${last ? " field" : ""}">
      <div class="stn">${ed(colPath(ci), colName(ci), "Station")}</div>
      <h4>${ed(`days.${di}.cells.${ci}.head`, cell.head, "Machine / pitch shape")}</h4>
      <div class="cap"></div>
      ${cell.drills.map((d,xi)=>`
        <div class="drill">
          <span class="n">${ed(`days.${di}.cells.${ci}.drills.${xi}.n`, d.n, "Drill name")}</span>
          <span class="dash">—</span>
          <span class="sw">${ed(`days.${di}.cells.${ci}.drills.${xi}.sw`, d.sw, "10 swings")}</span>
          <button class="del" data-del="days.${di}.cells.${ci}.drills.${xi}" title="Remove drill">&times;</button>
        </div>`).join("")}
      ${note}
      <button class="rowbtn" data-add="days.${di}.cells.${ci}.drills">+ Drill</button>
    </div>`;
}

function render(){
  const on = document.body.classList.contains("editing");
  document.getElementById("nCages").value = S.cages;
  document.querySelectorAll("#dayToggles button").forEach(b =>
    b.classList.toggle("on", S.days[Number(b.dataset.d)].on));
  const live = S.days.filter(d => d.on);
  document.getElementById("hint").innerHTML =
    `<b>${live.length}</b> training days &nbsp;·&nbsp; <b>${S.cages}</b> ${S.cages === 1 ? "cage" : "cages"} + on field`;

  const cols = S.cages + 1;
  const days = S.days.map((day,di) => !day.on ? "" : `
    <div class="day" style="--cols:${cols}">
      <div class="daylab">
        <div class="nm">${ed(`days.${di}.name`, day.name, "Day")}</div>
        <div class="fo">${ed(`days.${di}.focus`, day.focus, "Focus")}</div>
        <div class="me">${ed(`days.${di}.metric`, day.metric, "(Metric)")}</div>
        <div class="ph${/blend|prep/i.test(day.phase) ? " soft" : ""}">${ed(`days.${di}.phase`, day.phase, "Phase")}</div>
      </div>
      ${Array.from({length: cols}, (_,ci) => renderCell(di, ci)).join("")}
    </div>`).join("");

  const off = S.days.filter(d => !d.on).map(d => d.name).join(" / ");
  const offRow = off ? `
    <div class="offrow"><span class="nm">${esc(off)}</span>
      <span class="tx">${ed("offText", S.offText, "Off")}</span></div>` : "";

  document.getElementById("sheet").innerHTML = `
    <h1>${ed("title", S.title, "Sheet title", "")}</h1>
    <div class="sub">${ed("sub", S.sub, "Cages, field, and what rotates week to week", "")}</div>
    <div class="goldrule"></div>

    <div class="env">
      <div class="tag">${ed("envLabel", S.envLabel, "Label")}</div>
      <div class="body">${ed("envText", S.envText, "Machines, ball types, and who is throwing", "")}</div>
    </div>

    <div class="week">${days}</div>
    ${offRow}

    <div class="footer">
      <div class="tokens">${ed("footer", S.footer, "How the focus days and phases distribute across the week", "")}</div>
      <div class="note">${ed("footnote", S.footnote, "The one paragraph a coach reading this cold needs: what repeats, what changes, and what the week adds up to", "")}</div>
    </div>`;

  document.querySelectorAll("[data-p]").forEach(n => n.setAttribute("contenteditable", on));
}

/* ============ state plumbing ============ */
const getPath = p => p.split(".").reduce((o,k)=>o[k], S);
function setPath(p,val){
  const k = p.split("."); let o = S;
  for(let i=0;i<k.length-1;i++) o = o[k[i]];
  o[k[k.length-1]] = val;
}
function delPath(p){
  const k = p.split("."); let o = S;
  for(let i=0;i<k.length-1;i++) o = o[k[i]];
  o.splice(Number(k[k.length-1]), 1);
}
/* Every day carries one cell per cage plus the on-field cell, always last.
   Resizing the cage count inserts or drops cells just before that field cell,
   so nothing a coach typed on field moves columns. */
function syncCells(n){
  const old = S.cages;
  for(const day of S.days){
    const field = day.cells[old] || blankCell();
    day.cells.length = old;
    while(day.cells.length < n) day.cells.push(blankCell());
    day.cells.length = n;
    day.cells.push(field);
  }
  while(S.cageNames.length < n) S.cageNames.push("Cage " + (S.cageNames.length + 1));
  S.cageNames.length = n;
  S.cages = n;
}

document.addEventListener("input", e=>{
  const el = e.target.closest("[data-p]");
  if(!el) return;
  setPath(el.dataset.p, el.textContent);
  save();
});
document.addEventListener("paste", e=>{           // keep Word styling out of the sheet
  const el = e.target.closest("[data-p]");
  if(!el) return;
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text"));
});
document.addEventListener("click", e=>{
  const add = e.target.closest("[data-add]");
  if(add){ getPath(add.dataset.add).push({...BLANK_DRILL}); save(); render(); return; }
  const del = e.target.closest("[data-del]");
  if(del){ delPath(del.dataset.del); save(); render(); }
});

/* ============ plan library ============ */
function switchTo(id){ LIB.current = id; S = LIB.plans[id].state; save(); renderPlanList(); render(); }

document.getElementById("planSel").onchange = e => switchTo(e.target.value);

document.getElementById("newBtn").onclick = ()=>{
  const name = prompt("Name this plan", "Plan " + (Object.keys(LIB.plans).length + 1));
  if(name === null) return;
  const id = newId();
  LIB.plans[id] = {name: name.trim() || "Untitled plan", updated: Date.now(), state: blankState()};
  switchTo(id);
};
document.getElementById("dupBtn").onclick = ()=>{
  const cur = LIB.plans[LIB.current];
  const name = prompt("Name the copy", cur.name + " copy");
  if(name === null) return;
  const id = newId();
  LIB.plans[id] = {name: name.trim() || "Untitled plan", updated: Date.now(),
                   state: JSON.parse(JSON.stringify(cur.state))};
  switchTo(id);
};
document.getElementById("renameBtn").onclick = ()=>{
  const cur = LIB.plans[LIB.current];
  const name = prompt("Rename plan", cur.name);
  if(name === null) return;
  cur.name = name.trim() || cur.name;
  save(); renderPlanList();
};
document.getElementById("delBtn").onclick = ()=>{
  const ids = Object.keys(LIB.plans);
  if(ids.length === 1) return alert("This is your only plan. Use Clear sheet to empty it.");
  if(!confirm(`Delete "${LIB.plans[LIB.current].name}"? This can't be undone.`)) return;
  delete LIB.plans[LIB.current];
  switchTo(Object.keys(LIB.plans)[0]);
};
document.getElementById("clearBtn").onclick = ()=>{
  if(!confirm("Clear every field on this plan? This can't be undone.")) return;
  LIB.plans[LIB.current].state = blankState();
  S = LIB.plans[LIB.current].state;
  save(); render();
};

/* ============ sheet controls ============ */
document.getElementById("editBtn").onclick = e=>{
  const on = document.body.classList.toggle("editing");
  e.target.classList.toggle("on", on);
  e.target.textContent = on ? "Editing on" : "Editing off";
  document.querySelectorAll("[data-p]").forEach(n => n.setAttribute("contenteditable", on));
};
document.getElementById("nCages").oninput = e=>{
  syncCells(Math.max(1, Math.min(4, Number(e.target.value) || 1)));
  save(); render();
  document.getElementById("nCages").focus();
};
document.getElementById("dayToggles").innerHTML = DAY_NAMES.map((n,i)=>
  `<button data-d="${i}" title="${n}">${n.slice(0,3)}</button>`).join("");
document.getElementById("dayToggles").onclick = e=>{
  const b = e.target.closest("[data-d]");
  if(!b) return;
  const day = S.days[Number(b.dataset.d)];
  if(day.on && S.days.filter(d=>d.on).length === 1) return alert("Keep at least one training day on the sheet.");
  day.on = !day.on;
  save(); render();
};
document.getElementById("printBtn").onclick = ()=>{
  document.title = LIB.plans[LIB.current].name;   // names the browser's own PDF
  window.print();
  setTimeout(()=>{ document.title = "Weekly Hitting Template Builder"; }, 1000);
};

/* One-click PDF: capture the sheet exactly as it looks in the builder and
   drop it on a Letter page. Image-based, so text isn't selectable -- the
   Print button is the route to a text PDF. */
document.getElementById("pdfBtn").onclick = async e=>{
  const btn = e.target, sheet = document.getElementById("sheet");
  const wasEditing = document.body.classList.contains("editing");
  btn.disabled = true; btn.textContent = "Working...";
  document.body.classList.remove("editing");        // drop underlines and grey prompts
  document.querySelectorAll(".rowbtn,.del").forEach(n => n.style.visibility = "hidden");
  try{
    const canvas = await html2canvas(sheet, {scale:2, backgroundColor:"#FFFFFF", useCORS:true});
    const pdf = new window.jspdf.jsPDF({unit:"in", format:"letter", orientation:"portrait"});
    const margin = 0.4, pw = 8.5 - margin*2, ph = 11 - margin*2;
    const w = pw, h = canvas.height * (pw / canvas.width);
    if(h <= ph * 1.02){
      pdf.addImage(canvas.toDataURL("image/jpeg", 0.95), "JPEG", margin, margin, w, Math.min(h, ph));
    }else{
      // taller than one page: slice the capture across pages at the same scale
      const pxPerPage = Math.floor(canvas.width * (ph / pw));
      for(let y = 0, page = 0; y < canvas.height; y += pxPerPage, page++){
        const slice = document.createElement("canvas");
        slice.width = canvas.width;
        slice.height = Math.min(pxPerPage, canvas.height - y);
        if(slice.height < canvas.height * 0.02) break;   // don't emit a near-empty page
        slice.getContext("2d").drawImage(canvas, 0, y, canvas.width, slice.height,
                                                 0, 0, canvas.width, slice.height);
        if(page) pdf.addPage();
        pdf.addImage(slice.toDataURL("image/jpeg", 0.95), "JPEG", margin, margin,
                     w, slice.height * (pw / canvas.width));
      }
    }
    const name = LIB.plans[LIB.current].name.replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") || "Weekly_template";
    pdf.save(name + ".pdf");
    flag("PDF saved");
  } finally {
    document.querySelectorAll(".rowbtn,.del").forEach(n => n.style.visibility = "");
    if(wasEditing) document.body.classList.add("editing");
    btn.disabled = false; btn.textContent = "Save PDF";
  }
};

document.getElementById("swatches").innerHTML = PRESETS.map(([n,c])=>
  `<button class="cswatch" data-c="${c}" style="background:${c}" title="${n}" aria-pressed="false"></button>`).join("");
document.getElementById("swatches").onclick = e=>{
  const b = e.target.closest(".cswatch");
  if(!b) return;
  LIB.accent = b.dataset.c; applyAccent(LIB.accent); save();
};
document.getElementById("accentPick").oninput = e=>{
  LIB.accent = e.target.value; applyAccent(LIB.accent); save();
};
applyAccent(LIB.accent || "#FFA300");

document.body.classList.add("editing");
renderPlanList();
render();
</script>
</body></html>
